<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>האפליקציות של יוסי</title>
  <meta name="description" content="דף הבית של האתר: ניהול ארגזים למעבר דירה ומחשבון ההתססה.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent-box: #2563eb;
      --accent-bread: #b45309;
    }

    /* שלושת מצבי הצופה: בחירה מפורשת בכהה, בבהיר, או לפי המערכת */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1220;
        --surface: #131c2e;
        --border: #24334d;
        --text: #e8eefc;
        --text-muted: #94a3b8;
        --accent-box: #3b82f6;
        --accent-bread: #fbbf24;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b1220;
      --surface: #131c2e;
      --border: #24334d;
      --text: #e8eefc;
      --text-muted: #94a3b8;
      --accent-box: #3b82f6;
      --accent-bread: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Rubik, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    main { width: 100%; max-width: 560px; }

    h1 { font-size: 1.5rem; margin: 0 0 .3rem; }
    .sub { color: var(--text-muted); margin: 0 0 1.5rem; font-size: .95rem; }

    .apps { display: grid; gap: .8rem; }

    .app-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-inline-start: 5px solid var(--accent);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .app-link:hover,
    .app-link:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, .12);
      outline: none;
      border-color: var(--accent);
      border-inline-start-color: var(--accent);
    }
    .app-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app-link--boxes { --accent: var(--accent-box); }
    .app-link--bread { --accent: var(--accent-bread); }

    .app-link__icon { font-size: 2rem; line-height: 1; }
    .app-link__name { display: block; font-weight: 700; font-size: 1.05rem; }
    .app-link__desc { display: block; color: var(--text-muted); font-size: .85rem; margin-top: .15rem; }
    .app-link__arrow { margin-inline-start: auto; color: var(--text-muted); font-size: 1.2rem; }

    footer { margin-top: 1.5rem; color: var(--text-muted); font-size: .8rem; text-align: center; }

    @media (prefers-reduced-motion: reduce) {
      .app-link { transition: none; }
      .app-link:hover, .app-link:focus-visible { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>האפליקציות שלי</h1>
    <p class="sub">בחרו אפליקציה. שתיהן נפתחות בדפדפן וניתנות להוספה למסך הבית.</p>

    <div class="apps">
      <a class="app-link app-link--boxes" href="moving-box-manager/">
        <span class="app-link__icon" aria-hidden="true">📦</span>
        <span>
          <span class="app-link__name">ניהול ארגזים</span>
          <span class="app-link__desc">מעבר דירה: מספור, קודי QR, חיפוש והדפסת מדבקות</span>
        </span>
        <span class="app-link__arrow" aria-hidden="true">←</span>
      </a>

      <a class="app-link app-link--bread" href="fermentation_calculator.html">
        <span class="app-link__icon" aria-hidden="true">🍞</span>
        <span>
          <span class="app-link__name">מחשבון התססה</span>
          <span class="app-link__desc">חישובי תססה וקליברציה לאפייה</span>
        </span>
        <span class="app-link__arrow" aria-hidden="true">←</span>
      </a>
    </div>

    <footer>להוספה למסך הבית: תפריט הדפדפן ← "הוספה למסך הבית"</footer>
  </main>
</body>
</html>
