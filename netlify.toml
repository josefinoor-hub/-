# Netlify Configuration
# =====================================================
# באתר הזה יושבות שתי אפליקציות:
#   /                      — מחשבון ההתססה
#   /moving-box-manager/   — ניהול ארגזים למעבר דירה
# סדר כללי ההפניה חשוב: הכללים של אפליקציית הארגזים חייבים להופיע
# לפני כלל ה-catch-all, אחרת כל בקשה תופנה למחשבון ההתססה.

[build]
  command = ""
  publish = "."

# --- ניהול ארגזים למעבר דירה ---
[[redirects]]
  from = "/moving-box-manager"
  to = "/moving-box-manager/"
  status = 301

[[redirects]]
  from = "/moving-box-manager/"
  to = "/moving-box-manager/index.html"
  status = 200

# --- מחשבון ההתססה (כלל ברירת המחדל) ---
[[redirects]]
  from = "/*"
  to = "/fermentation_calculator.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Content-Type = "application/javascript"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript"

# --- ניהול ארגזים: ביטול המטמון הארוך של *.js ---
# מודולי האפליקציה מתעדכנים יחד עם הגרסה, ולכן חייבים להיבדק מול השרת.
# בלי זה גרסה חדשה לא תגיע למכשירים עד לפקיעת המטמון.
[[headers]]
  for = "/moving-box-manager/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/moving-box-manager/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/moving-box-manager/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/moving-box-manager/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"

[dev]
  command = "python -m SimpleHTTPServer 8000"
  port = 8000
  publish = "."

[context.production]
  command = ""
  publish = "."
